name: Continuous Integration

# Configuración de los disparadores para las ramas principales
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  audit:
    name: Audit & QA
    runs-on: ubuntu-latest

    steps:
      - name: Descargamos el código fuente
        uses: actions/checkout@v3

      - name: Preparamos el entorno PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          extensions: pdo_mysql

      - name: Instalación de las dependencias de control de calidad
        run: composer install --prefer-dist --no-progress

      - name: Ejeución de el análisis estático y formateo estricto
        run: composer run check
